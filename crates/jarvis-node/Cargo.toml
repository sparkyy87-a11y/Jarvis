[package]
name = "jarvis-node"
description = "Jarvis-Dienst pro Gerät: Mesh, Ausführung, Dateitransfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jarvisd"
path = "src/bin/jarvisd.rs"

[[bin]]
name = "jarvis"
path = "src/bin/jarvis.rs"

[dependencies]
jarvis-protocol.workspace = true
jarvis-intent.workspace = true
jarvis-brain.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
snow = "0.9"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
mdns-sd = "0.11"
sysinfo = "0.30"
gethostname = "0.5"

[dev-dependencies]
tempfile = "3"
