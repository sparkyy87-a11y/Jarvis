[package]
name = "mira-node"
description = "Mira-Dienst pro Gerät: Mesh, Ausführung, Dateitransfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mirad"
path = "src/bin/mirad.rs"

[[bin]]
name = "mira-hintergrund"
path = "src/bin/mira-hintergrund.rs"

[[bin]]
name = "mira"
path = "src/bin/mira.rs"

[features]
default = ["desktop"]
# Prozessliste für „schließe <App>" (nicht auf dem Handy nötig)
desktop = ["dep:sysinfo"]

[dependencies]
mira-protocol.workspace = true
mira-intent.workspace = true
mira-brain.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
snow = "0.9"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
mdns-sd = "0.11"
sysinfo = { version = "0.30", optional = true }
gethostname = "0.5"
qrcode = { version = "0.14", default-features = false }
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
