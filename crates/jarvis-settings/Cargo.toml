[package]
name = "jarvis-settings"
description = "Einstellungen für Jarvis mit grafischer Oberfläche"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jarvis-einstellungen"
path = "src/main.rs"

[dependencies]
jarvis-node = { path = "../jarvis-node" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
qrcode = { version = "0.14", default-features = false }
cpal = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
