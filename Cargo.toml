[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
jarvis-protocol = { path = "crates/jarvis-protocol" }
jarvis-intent = { path = "crates/jarvis-intent" }
jarvis-brain = { path = "crates/jarvis-brain" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
