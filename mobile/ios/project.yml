# Xcode-Projekt wird mit XcodeGen erzeugt:  brew install xcodegen && xcodegen
name: Mira
options:
  bundleIdPrefix: de.mira
  deploymentTarget:
    iOS: "17.0"
targets:
  Mira:
    type: application
    platform: iOS
    sources:
      - path: Mira
      - path: Generated/mira_mobile.swift
    dependencies:
      - framework: Generated/MiraCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mira.app
        PRODUCT_NAME: Mira
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Mira/Info.plist
      properties:
        CFBundleDisplayName: Mira
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Mira hört zu, solange du die Mikrofon-Taste gedrückt hältst.
        NSSpeechRecognitionUsageDescription: Mira wandelt deine Befehle auf dem Gerät in Text um.
        NSAppleMusicUsageDescription: Mira spielt auf Zuruf Musik aus deiner Mediathek ab.
        NSLocalNetworkUsageDescription: Mira verbindet sich verschlüsselt mit deinen eigenen Geräten im WLAN.
        NSBonjourServices: [_mira._tcp]
        # Empfangene Dateien in der Dateien-App unter „Auf meinem iPhone › Mira"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: de.mira.pair
            CFBundleURLSchemes: [mira]
