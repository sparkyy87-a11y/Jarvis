# Xcode-Projekt wird mit XcodeGen erzeugt:  brew install xcodegen && xcodegen
name: Jarvis
options:
  bundleIdPrefix: de.jarvis
  deploymentTarget:
    iOS: "17.0"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
      - path: Generated/jarvis_mobile.swift
    dependencies:
      - framework: Generated/JarvisCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jarvis.app
        PRODUCT_NAME: Jarvis
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: Jarvis hört zu, solange du die Mikrofon-Taste gedrückt hältst.
        NSSpeechRecognitionUsageDescription: Jarvis wandelt deine Befehle auf dem Gerät in Text um.
        NSAppleMusicUsageDescription: Jarvis spielt auf Zuruf Musik aus deiner Mediathek ab.
        NSLocalNetworkUsageDescription: Jarvis verbindet sich verschlüsselt mit deinen eigenen Geräten im WLAN.
        NSBonjourServices: [_jarvis._tcp]
        # Empfangene Dateien in der Dateien-App unter „Auf meinem iPhone › Jarvis"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: de.jarvis.pair
            CFBundleURLSchemes: [jarvis]
