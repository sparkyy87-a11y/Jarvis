# Baut und testet Mira auf Linux, Windows und macOS.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Pakete (Mikrofon, Sprachtest)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db indiziert sonst nach jeder Installation minutenlang Handbuchseiten
          sudo rm -f /var/lib/man-db/auto-update
          # Die Paketserver sind gelegentlich kurz nicht erreichbar: bis zu dreimal versuchen.
          for i in 1 2 3; do
            sudo apt-get update -q && \
            sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 libasound2-dev espeak-ng ffmpeg && break
            echo "Versuch $i fehlgeschlagen, warte …"; sleep 20
          done
      - name: Whisper-Modelle zwischenspeichern
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mira/models
          key: whisper-small-q5_1-silero-v5.1.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Zwei Geräte Ende-zu-Ende
        if: runner.os == 'Linux'
        run: ./scripts/e2e.sh
      - name: Sprache Ende-zu-Ende (Whisper auf CPU)
        if: runner.os == 'Linux'
        run: ./scripts/voice-e2e.sh
      - name: Release-Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: mira-${{ matrix.os }}
          path: |
            target/release/mirad
            target/release/mira
            target/release/mirad.exe
            target/release/mira.exe
            target/release/mira-listen
            target/release/mira-listen.exe
            target/release/mira-hintergrund
            target/release/mira-hintergrund.exe
            target/release/mira-hud
            target/release/mira-hud.exe
            target/release/mira-einstellungen
            target/release/mira-einstellungen.exe
          if-no-files-found: ignore
