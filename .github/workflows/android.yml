# Baut die Android-App (APK zum Herunterladen) und prüft die Kotlin-Anbindung
# gegen einen echt laufenden jarvisd.
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Kotlin-Anbindung gegen echten jarvisd testen
        working-directory: mobile/android
        run: ./gradlew :bindings-test:test --console=plain
      - name: APK bauen
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
